loaderVersion="[47]"
license="LGPLv3"
issueTrackerURL="https://github.com/nice-john/Creatures_And_Beasts-Forge/issues"
[[mods]]
modId="cnb"
version="${file.jarVersion}"
displayName="Creatures and Beasts: Unofficial Port"
# updateJSONURL="http://myurl.me/"
displayURL="https://github.com/CreaturesAndBeasts/Creatures_And_Beasts-Forge"
logoFile="logo.png"
credits="Credits to AzureDoom and Christian for contributions to the code"
authors="Joosh, CGessinger, and HellionGames"
description='''
Creatures and Beasts is a vanilla-style creature mod which fills each biome with new mobs, from the plains of the overworld to the void of the end!
'''
[[dependencies.cnb]]
    modId = "forge"
    mandatory = true
    versionRange = "[47.0.0,47.9.0]"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.cnb]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="BOTH"

[[dependencies.cnb]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.0,4.9]"
    ordering="BEFORE"
    side="BOTH"

