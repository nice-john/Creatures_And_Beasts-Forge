plugins {
    // 26.x is unobfuscated: the non-remapping Loom plugin id replaces 'fabric-loom'.
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = '2.0.0'
group = 'com.cgessinger.creaturesandbeasts'
base {
    archivesName = "CNB-26.3-fabric"
}

// Loom needs an explicit pointer to the access widener; the fabric.mod.json
// "accessWidener" field alone is not enough to wire it into the runtime
// classpath transformations. Path is relative to the project root.
loom {
    accessWidenerPath = file("src/main/resources/creatures-and-beasts.aw")
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.geckolib")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    // Night Config is on Maven Central
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    // No mappings line: 26.x ships unobfuscated, so mod dependencies are plain
    // implementation (no modImplementation remapping).
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.166.2+26.3"

    // GeckoLib 5 for Fabric 26.3 (group moved from software.bernie.geckolib to com.geckolib).
    implementation "com.geckolib:geckolib-fabric-26.3:${geckolib_version}"

    // Night Config Ã¢â‚¬â€œ TOML for our simple config.
    // The toml artifact contains only the TOML codec; CommentedFileConfig lives in
    // :core. We must `include` both Ã¢â‚¬â€ Loom's include directive only jar-in-jars
    // the literally listed artifact, not its transitive dependencies, so omitting
    // :core works in dev (where the gradle classpath provides it) but throws
    // NoClassDefFoundError at runtime in a published jar.
    include implementation("com.electronwill.night-config:core:3.6.7")
    include implementation("com.electronwill.night-config:toml:3.6.7")
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs << '-Xmaxerrs' << '10000'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
