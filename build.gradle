plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'idea'
}

version = '2.0.1'
group = 'com.cgessinger.creaturesandbeasts'

base {
    archivesName = 'CNB-26.3-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.3.0.113'

    // GeckoLib 5 injects GeoRenderState into vanilla render states; MDG needs the data file to compile against it.
    interfaceInjectionData.from('interface_injections.json')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cnb'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cnb'
        }

        data {
            clientData()
            programArguments.addAll '--mod', 'cnb', '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        cnb {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    packIntoJar {
        transitive = false
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("com\\.geckolib.*")
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven { url = 'https://maven.infernalstudios.org/releases' }
}

dependencies {
    // GeckoLib 5.5 (NeoForge 26.3); base package is com.geckolib
    implementation 'com.geckolib:geckolib-neoforge-26.3:5.5.7'

    implementation 'org.infernalstudios:config:3.0.3'
    packIntoJar 'org.infernalstudios:config:3.0.3'
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.packIntoJar]
    relocate 'org.infernalstudios.config', 'com.cgessinger.creaturesandbeasts.config.library'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "cnb",
                "Specification-Vendor"    : "bonsaistudios",
                "Specification-Version"   : "1",
                "Implementation-Title"    : "cnb",
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "bonsaistudios",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    archiveClassifier.set('base')
}

tasks.build.dependsOn shadowJar

tasks.withType(JavaCompile).configureEach { options.compilerArgs.addAll(['-Xmaxerrs', '10000']) }
