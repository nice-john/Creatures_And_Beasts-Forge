plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = '1.1.13'
group = 'com.cgessinger.creaturesandbeasts'
archivesBaseName = "CNB-1.21.1-fabric"

// Loom needs an explicit pointer to the access widener; the fabric.mod.json
// "accessWidener" field alone is not enough for Loom 1.6+ to wire it into the
// runtime classpath transformations. Path is relative to the project root.
loom {
    accessWidenerPath = file("src/main/resources/creatures-and-beasts.aw")
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    // Night Config is on Maven Central
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    // Latest fabric-api for 1.21.1 (last released for that version line).
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.115.0+1.21.1"

    // GeckoLib for Fabric 1.21.1 — pulled in via gradle.properties pin.
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${geckolib_version}"

    // Night Config – TOML for our simple config.
    // The toml artifact contains only the TOML codec; CommentedFileConfig lives in
    // :core (and :core depends on nothing). We must `include` both — Loom's
    // include directive only jar-in-jars the literally listed artifact, not its
    // transitive dependencies, so omitting :core works in dev (where the gradle
    // classpath provides it) but throws NoClassDefFoundError at runtime in a
    // published jar.
    include implementation("com.electronwill.night-config:core:3.6.7")
    include implementation("com.electronwill.night-config:toml:3.6.7")
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
