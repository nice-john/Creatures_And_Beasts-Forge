plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.165'
    // GradleUp fork is the maintained successor of johnrengelman/shadow (which was abandoned
    // and bundles ASM 9.5 — too old to read Java 21 bytecode, fails with "Unsupported class
    // file major version 65"). 8.3.x ships ASM 9.7+. Drop-in replacement.
    id 'com.gradleup.shadow' version '8.3.5'
    id 'eclipse'
}

import groovy.json.JsonSlurper
import groovy.json.JsonOutput

version = '1.7.13'
group = 'com.cgessinger.creaturesandbeasts'
archivesBaseName = "CNB-1.21.1-neoforge"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        workingDirectory project.file('run')
        systemProperty 'forge.enabledGameTestNamespaces', 'cnb'
    }

    server {
        workingDirectory project.file('run')
        systemProperty 'forge.enabledGameTestNamespaces', 'cnb'
        programArgument '--nogui'
    }

    data {
        workingDirectory project.file('run')
        programArguments.addAll '--mod', 'cnb', '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    packIntoJar {
        transitive = false
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven { url = 'https://maven.infernalstudios.org/releases' }
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.150"

    // GeckoLib (NeoForge 1.21.1)
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.8.3'
    implementation 'com.eliotlash.mclib:mclib:20'

    implementation 'org.infernalstudios:config:3.0.3'
    packIntoJar 'org.infernalstudios:config:3.0.3'
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.packIntoJar]
    relocate 'org.infernalstudios.config', 'com.cgessinger.creaturesandbeasts.config.library'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "cnb",
                "Specification-Vendor"    : "bonsaistudios",
                "Specification-Version"   : "1",
                "Implementation-Title"    : "cnb",
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "bonsaistudios",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    archiveClassifier.set('base')
}

tasks.build.dependsOn shadowJar
