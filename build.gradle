plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = '1.6.5'
group = 'com.cgessinger.creaturesandbeasts'
archivesBaseName = "CNB-1.20.1-fabric"

// Loom needs an explicit pointer to the access widener; the fabric.mod.json
// "accessWidener" field alone is not enough for Loom 1.6 to wire it into the
// runtime classpath transformations. Path is relative to the project root.
loom {
    accessWidenerPath = file("src/main/resources/creatures-and-beasts.aw")
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    // Night Config is on Maven Central
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.15.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1"

    // GeckoLib for Fabric 1.20.1
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:${geckolib_version}"

    // Night Config – TOML for our simple config
    include implementation("com.electronwill.night-config:toml:3.6.7")
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
