# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# NeoGradle 7 + Minecraft 1.21.1 require Java 17+. Pin to the JDK 21 install on this machine
# so `gradlew` works regardless of what JAVA_HOME points at in the user's shell / IDE.
# Java properties files need escaped backslashes; spaces are fine without quoting.
org.gradle.java.home=C:\\Program Files\\Java\\ms-21.0.10

geckolib_version=4.4.6
